<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Guia Converter</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffd86b, #f6a23a);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 500px;
      background: white;
      border-radius: 24px;
      padding: 30px 24px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0,0,0,0.15);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 30px;
      color: #222;
    }

    .subtitulo {
      margin: 0 0 25px;
      color: #666;
      font-size: 16px;
    }

    .icone {
      font-size: 55px;
      margin-bottom: 10px;
    }

    input[type="file"] {
      display: none;
    }

    .botao {
      display: inline-block;
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      background: #222;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .botao:hover {
      opacity: 0.9;
    }

    .botao:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .arquivo {
      margin-top: 18px;
      padding: 14px;
      background: #f5f5f5;
      border-radius: 12px;
      color: #444;
      font-size: 14px;
      word-break: break-word;
    }

    .status {
      margin-top: 20px;
      min-height: 24px;
      font-weight: bold;
      color: #444;
    }

    .progresso {
      width: 100%;
      height: 10px;
      background: #eee;
      border-radius: 20px;
      overflow: hidden;
      margin-top: 12px;
      display: none;
    }

    .barra {
      height: 100%;
      width: 0%;
      background: #222;
      transition: width 0.2s;
    }

    .resultado {
      margin-top: 22px;
      display: none;
    }

    .salvar {
      display: block;
      width: 100%;
      padding: 16px;
      background: #28a745;
      color: white;
      text-decoration: none;
      border-radius: 14px;
      font-size: 17px;
      font-weight: bold;
    }

    .observacao {
      margin-top: 22px;
      font-size: 13px;
      color: #777;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="icone">🎵</div>

    <h1>Guia Converter</h1>

    <p class="subtitulo">
      Transforme seu vídeo em áudio
    </p>

    <!-- Selecionar arquivo -->
    <label for="arquivoVideo" class="botao">
      📁 Selecionar MP4
    </label>

    <input
      type="file"
      id="arquivoVideo"
      accept="video/mp4,video/*"
    >

    <div id="nomeArquivo" class="arquivo" style="display:none;"></div>

    <!-- Botão converter -->
    <button id="btnConverter" class="botao" disabled>
      🎧 Extrair áudio
    </button>

    <div id="status" class="status"></div>

    <div id="progresso" class="progresso">
      <div id="barra" class="barra"></div>
    </div>

    <!-- Resultado -->
    <div id="resultado" class="resultado">

      <a
        id="btnSalvar"
        class="salvar"
        href="#"
        download="audio.mp4"
      >
        💾 Salvar áudio
      </a>

    </div>

    <p class="observacao">
      A conversão acontece no próprio navegador.
      O vídeo não precisa ser enviado para um servidor.
    </p>

  </div>

  <script>
    const inputArquivo = document.getElementById("arquivoVideo");
    const nomeArquivo = document.getElementById("nomeArquivo");
    const btnConverter = document.getElementById("btnConverter");
    const status = document.getElementById("status");
    const progresso = document.getElementById("progresso");
    const barra = document.getElementById("barra");
    const resultado = document.getElementById("resultado");
    const btnSalvar = document.getElementById("btnSalvar");

    let arquivoSelecionado = null;

    inputArquivo.addEventListener("change", function() {
      arquivoSelecionado = this.files[0];
      if (!arquivoSelecionado) return;

      nomeArquivo.style.display = "block";
      nomeArquivo.textContent = "📹 " + arquivoSelecionado.name;
      btnConverter.disabled = false;
      resultado.style.display = "none";
      status.textContent = "Vídeo selecionado. Pronto para extrair o áudio.";
      barra.style.width = "0%";
    });

    btnConverter.addEventListener("click", async function() {
      if (!arquivoSelecionado) return;

      btnConverter.disabled = true;
      resultado.style.display = "none";
      progresso.style.display = "block";
      barra.style.width = "30%";
      status.textContent = "⏳ Processando vídeo...";

      try {
        // Criar um elemento de vídeo temporário na memória
        const videoElement = document.createElement('video');
        videoElement.src = URL.createObjectURL(arquivoSelecionado);
        videoElement.muted = true;
        
        await new Promise((resolve, reject) => {
          videoElement.onloadedmetadata = () => resolve();
          videoElement.onerror = () => reject(new Error("Não foi possível ler o arquivo de vídeo."));
        });

        barra.style.width = "60%";
        status.textContent = "🎧 Extraindo faixa de áudio...";

        // Usar Streams / MediaElementAudioSource para extrair o áudio diretamente
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioCtx.createMediaElementSource(videoElement);
        const destination = audioCtx.createMediaStreamDestination();
        source.connect(destination);
        source.connect(audioCtx.destination);

        const mediaRecorder = new MediaRecorder(destination.stream, {
          mimeType: MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : 'audio/webm'
        });

        const chunks = [];
        mediaRecorder.ondataavailable = e => chunks.push(e.data);
        
        mediaRecorder.onstop = () => {
          const blobType = mediaRecorder.mimeType;
          const extension = blobType.includes('mp4') ? 'm4a' : 'webm';
          const blob = new Blob(chunks, { type: blobType });
          const url = URL.createObjectURL(blob);

          const nomeOriginal = arquivoSelecionado.name.replace(/\.[^/.]+$/, "");
          btnSalvar.href = url;
          btnSalvar.download = nomeOriginal + "." + extension;

          barra.style.width = "100%";
          resultado.style.display = "block";
          status.textContent = "✅ Áudio pronto com sucesso!";
          btnConverter.disabled = false;
        };

        mediaRecorder.start();
        videoElement.play();

        videoElement.onended = () => {
          mediaRecorder.stop();
          audioCtx.close();
        };

        // Segurança caso o vídeo demore ou ocorra interrupção
        setTimeout(() => {
          if (videoElement.paused && mediaRecorder.state === "recording") {
            mediaRecorder.stop();
          }
        }, (videoElement.duration * 1000) + 2000);

      } catch (erro) {
        console.error("ERRO:", erro);
        status.textContent = "❌ Erro ao extrair áudio.";
        alert("Erro ao processar o arquivo: " + (erro.message || erro));
        btnConverter.disabled = false;
        progresso.style.display = "none";
      }
    });
  </script>

</body>
</html>
