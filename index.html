<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guia Converter - Extrator e Conversor Rápido de Áudio</title>
    
    <style>
        :root {
            --primary: #4a6fa5;
            --primary-dark: #3b5984;
            --secondary: #f4f6f9;
            --accent: #ff6b6b;
            --text: #2c3e50;
            --card-bg: #ffffff;
            --border: #e1e8ed;
            --success: #059669;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f0f4f8;
            color: var(--text);
            padding: 20px;
            max-width: 650px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 20px 0;
        }

        h1 {
            font-size: 1.6rem;
            color: var(--primary-dark);
            margin-bottom: 8px;
        }

        p.subtitle {
            font-size: 0.95rem;
            color: #64748b;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border);
        }

        .drop-zone {
            border: 2px dashed var(--primary);
            border-radius: 8px;
            padding: 30px 20px;
            text-align: center;
            background: #f8fafc;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }

        .drop-zone:hover {
            background: #f1f5f9;
            border-color: var(--primary-dark);
        }

        input[type="file"] {
            display: none;
        }

        .file-info {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #475569;
            word-break: break-all;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover {
            background-color: var(--primary-dark);
        }

        .btn:disabled {
            background-color: #cbd5e1;
            cursor: not-allowed;
        }

        .status-box {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            text-align: center;
            display: none;
        }

        .status-processing {
            background: #fef3c7;
            color: #92400e;
            border: 1px solid #fde68a;
        }

        .status-success {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
        }

        .status-error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }
    </style>
</head>
<body>

    <header>
        <h1>⚡ Guia Converter</h1>
        <p class="subtitle">Extraia e converta áudio de vídeos/áudios em segundos via RAM</p>
    </header>

    <div class="card">
        <label for="inputArquivo" class="drop-zone" id="dropZone">
            📁 <b>Clique aqui</b> ou arraste um ficheiro de áudio/vídeo (MP4, MP3, MOV, WebM, etc.)
        </label>
        <input type="file" id="inputArquivo" accept="audio/*,video/*">

        <div id="fileInfo" class="file-info"></div>

        <button class="btn" id="btnConverter" disabled>⚡ Converter para WAV em alta velocidade</button>

        <div id="statusBox" class="status-box"></div>
    </div>

    <script>
        const inputArquivo = document.getElementById('inputArquivo');
        const fileInfo = document.getElementById('fileInfo');
        const btnConverter = document.getElementById('btnConverter');
        const statusBox = document.getElementById('statusBox');

        let arquivoSelecionado = null;

        inputArquivo.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                arquivoSelecionado = e.target.files[0];
                fileInfo.innerHTML = `<b>Ficheiro selecionado:</b> ${arquivoSelecionado.name} (${(arquivoSelecionado.size / (1024 * 1024)).toFixed(2)} MB)`;
                btnConverter.disabled = false;
                esconderStatus();
            }
        });

        btnConverter.addEventListener('click', async () => {
            if (!arquivoSelecionado) return;

            btnConverter.disabled = true;
            mostrarStatus('⏳ A processar e extrair áudio em alta velocidade...', 'processing');

            try {
                const tempoInicio = performance.now();
                const wavBlob = await converterParaWavRapido(arquivoSelecionado);
                const tempoTotal = ((performance.now() - tempoInicio) / 1000).toFixed(2);

                // Criar link de download automático
                const downloadUrl = URL.createObjectURL(wavBlob);
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = arquivoSelecionado.name.replace(/\.[^/.]+$/, "") + "_convertido.wav";
                a.click();

                mostrarStatus(`✅ Concluído com sucesso em ${tempoTotal}s! O download começou automaticamente.`, 'success');
            } catch (err) {
                console.error(err);
                mostrarStatus('❌ Erro ao converter o ficheiro. Certifique-se de que é um formato válido.', 'error');
            } finally {
                btnConverter.disabled = false;
            }
        });

        // ============================================================
        // LÓGICA DE CONVERSÃO RÁPIDA (DO GUIA PLAY)
        // ============================================================
        async function converterParaWavRapido(arquivoInput) {
            const arrayBuffer = await arquivoInput.arrayBuffer();
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            // Decodifica áudio direto em memória
            const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

            // Renderiza offline na velocidade máxima do processador
            const offlineCtx = new OfflineAudioContext(
                audioBuffer.numberOfChannels,
                audioBuffer.length,
                audioBuffer.sampleRate
            );

            const source = offlineCtx.createBufferSource();
            source.buffer = audioBuffer;
            source.connect(offlineCtx.destination);
            source.start();

            const renderedBuffer = await offlineCtx.startRendering();

            // Transforma o buffer para Blob do tipo WAV
            return audioBufferToWavBlob(renderedBuffer);
        }

        function audioBufferToWavBlob(buffer) {
            const numOfChan = buffer.numberOfChannels;
            const length = buffer.length * numOfChan * 2 + 44;
            const out = new DataView(new ArrayBuffer(length));
            let channels = [], sampleRate = buffer.sampleRate, offset = 0, pos = 0;

            function writeString(str) {
                for (let i = 0; i < str.length; i++) out.setUint8(pos++, str.charCodeAt(i));
            }
            function setUint16(data) { out.setUint16(pos, data, true); pos += 2; }
            function setUint32(data) { out.setUint32(pos, data, true); pos += 4; }

            writeString('RIFF');
            setUint32(length - 8);
            writeString('WAVE');
            writeString('fmt ');
            setUint32(16);
            setUint16(1);
            setUint16(numOfChan);
            setUint32(sampleRate);
            setUint32(sampleRate * 2 * numOfChan);
            setUint16(numOfChan * 2);
            setUint16(16);
            writeString('data');
            setUint32(length - pos - 4);

            for (let i = 0; i < buffer.numberOfChannels; i++) {
                channels.push(buffer.getChannelData(i));
            }

            while (offset < buffer.length) {
                for (let i = 0; i < numOfChan; i++) {
                    let sample = Math.max(-1, Math.min(1, channels[i][offset]));
                    sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0;
                    out.setInt16(pos, sample, true);
                    pos += 2;
                }
                offset++;
            }

            return new Blob([out.buffer], { type: 'audio/wav' });
        }

        function mostrarStatus(texto, tipo) {
            statusBox.style.display = 'block';
            statusBox.innerText = texto;
            statusBox.className = `status-box status-${tipo}`;
        }

        function esconderStatus() {
            statusBox.style.display = 'none';
        }
    </script>
</body>
</html>
